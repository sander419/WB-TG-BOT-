name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Живой Postgres: миграции и SQL репозиториев компилятор не проверяет,
    # ошибка в имени колонки видна только при выполнении запроса.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commerceos
          POSTGRES_PASSWORD: commerceos
          POSTGRES_DB: commerceos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commerceos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://commerceos:commerceos@127.0.0.1:5432/commerceos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # Два проекта: фронтенд (мягкие настройки) и backend (strict).
      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Migrate
        run: npm run db:migrate

      # Ключ шифрования одноразовый: скрипт только пишет и читает свои же данные.
      - name: Smoke test on a live database
        run: |
          npm run --silent gen:key >> "$GITHUB_ENV"
          npm run smoke:db

      - name: Build
        run: npm run build

      # Схема БД и миграции не должны расходиться: если schema.ts поменяли,
      # а миграцию не сгенерировали — сборка падает здесь, а не в проде.
      - name: Check migrations are up to date
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain server/db/migrations)" ]; then
            echo "Схема изменена без миграции. Выполни: npm run db:generate"
            git status --porcelain server/db/migrations
            exit 1
          fi
